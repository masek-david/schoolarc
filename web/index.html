  <script>
    // Ignore the keyboard shortcuts that would prevent my keyboard shortcuts in Flutter
    window.addEventListener('keydown', function (event) {
      if (event.metaKey || event.ctrlKey) {
        switch (event.key.toLowerCase()) {
          case 'h':
          case 'e':
          case 'f':
          case '1':
          case '2':
          case '3':
          case '4':
          case 'd':
            event.preventDefault();
            break;
        }
      }
    });

    // Show the loader after 2 seconds
    setTimeout(() => {
      document.getElementById('loaderID').style.height = '12px';
    }, 2000);

    function blockTouch(e) {
      if (e.touches.length > 1) return;
      e.preventDefault();
    }

    const deviceBackground = window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'black'
      : 'white';

    // Load the colors from storage (saved from Flutter) or used predefined
    const surfaceContainer = localStorage.getItem('surfaceContainer') || deviceBackground;
    const surface = localStorage.getItem('surface') || deviceBackground;
    const primary = localStorage.getItem('primary') || '#5185F7';
    const secondaryContainer = localStorage.getItem('secondaryContainer') || '#C5E1FC';
    const tertiaryContainer = localStorage.getItem('tertiaryContainer') || '#A4A6F8';

    // And use these colors
    document.querySelector('.secondaryContainer').style.fill = secondaryContainer;
    document.querySelector('.tertiaryContainer').style.fill = tertiaryContainer;
    const elements = document.querySelectorAll('.primary');
    elements.forEach(el => {
      el.style.stopColor = primary;
    });
    if (window.innerWidth < 600) {
      // mobile
      document.body.style.backgroundColor = surface
    } else {
      // tablet
      document.body.style.backgroundColor = surfaceContainer;
    }

    const myLoader = document.querySelector('.myLoader');
    myLoader.style.backgroundColor = primary;
    myLoader.style.setProperty('--myLoader-color', secondaryContainer);

    // Block swipe gestures - mainly in safari - swipe the page from left to go back,...
    document.addEventListener('touchstart', blockTouch, { passive: false });
  </script>
