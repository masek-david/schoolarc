<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="">
  <!-- <meta name="theme-color" content="#0c1220"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Schoolarc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Schoolarc</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">

  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="icons/Icon-192.png" as="image">

  <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
    <img src="icons/Icon-192.png" srcset="icons/Icon-192.png 1x, icons/Icon-512.png 2x" alt="icon"
      style="width: 35vmin; height: auto; max-width: 512px; max-height: 512px;">

    <span class="loader"></span>
  </div>

  <style>
    html,
    body {
      overscroll-behavior-x: none;
    }
  </style>
</head>

<body style="background-color:#0c1220;">
  <script>
    window.addEventListener('keydown', function (event) {
      if (event.metaKey || event.ctrlKey) {
        switch (event.key.toLowerCase()) {
          case 'h':
          case 'e':
          case 'f':
          case '1':
          case '2':
          case '3':
          case '4':
          case 'd':
            event.preventDefault();
            break;
        }
      }
    });

    window.setBarColor = function (color) {
      try {
        console.log('Trying to set color: ' + color);

        let meta = document.querySelector('meta[name="theme-color"]');

        if (!meta) {
          meta = document.createElement('meta');
          meta.name = 'theme-color';
          document.head.appendChild(meta);
        }

        meta.setAttribute('content', color);

        // document
        //   .querySelector('meta[name="theme-color"]')
        //   .setAttribute('content', color);
      } catch (e) {
        console.error("Failed to set bar color:", e);
      }
    };

    document.addEventListener('touchstart', (startEvent) => {
      if (startEvent.touches.length > 1) return;
      startEvent.preventDefault();
    }, { passive: false });
  </script>

  <!-- Flutter app -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
